<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bounds — control room</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c2330; --line: #2a3242;
    --text: #dbe2ec; --dim: #8494ab; --mono: "Cascadia Code", "Consolas", monospace;
    --allow: #3fb970; --deny: #e5534b; --replay: #d29922; --accent: #6ca4f8;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 14px; }
  header h1 { font-size: 16px; font-family: var(--mono); font-weight: 600; }
  header .tag { color: var(--dim); font-size: 12.5px; }
  main { flex: 1; display: grid; grid-template-columns: 300px 1fr 420px; gap: 0; min-height: 0; }
  section { border-right: 1px solid var(--line); overflow-y: auto; padding: 14px; min-height: 0; }
  section:last-child { border-right: none; }
  h2 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 2px 8px; font-size: 12.5px; }
  .kv dt { color: var(--dim); }
  .kv dd { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .chip { display: inline-block; background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 0 8px; font-family: var(--mono); font-size: 11.5px; margin: 1px 2px 1px 0; }
  .b-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .b-head b { font-family: var(--mono); font-size: 13px; }
  .muted { color: var(--dim); font-size: 11.5px; }

  form { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  label { display: block; font-size: 11.5px; color: var(--dim); margin: 8px 0 3px; }
  input, textarea, select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-family: var(--mono); font-size: 12.5px; }
  textarea { resize: vertical; }
  button { margin-top: 10px; background: var(--accent); color: #0b1524; font-weight: 600; border: 0; border-radius: 6px; padding: 7px 16px; cursor: pointer; font-size: 13px; }
  button:disabled { opacity: .5; cursor: wait; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .result { border-left: 4px solid var(--line); }
  .result.allow { border-left-color: var(--allow); }
  .result.deny { border-left-color: var(--deny); }
  .result.replay { border-left-color: var(--replay); }
  .verdict { font-family: var(--mono); font-weight: 700; font-size: 13px; }
  .allow .verdict { color: var(--allow); } .deny .verdict { color: var(--deny); } .replay .verdict { color: var(--replay); }
  .reason { font-size: 14px; margin: 4px 0; }
  pre { font-family: var(--mono); font-size: 11.5px; color: var(--dim); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 6px; }
  .say { font-style: italic; color: var(--text); margin: 4px 0; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; padding: 4px 6px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
  td { padding: 5px 6px; border-bottom: 1px solid var(--panel2); vertical-align: top; font-family: var(--mono); font-size: 11.5px; }
  td.why { color: var(--deny); }
  td.ok { color: var(--allow); }
  .badge { font-family: var(--mono); font-size: 10.5px; font-weight: 700; border-radius: 4px; padding: 1px 6px; }
  .badge.allow { background: #12351f; color: var(--allow); }
  .badge.deny { background: #3d1512; color: var(--deny); }
  .badge.hold { background: #3a2c0d; color: var(--replay); }
  .result.hold { border-left-color: var(--replay); }
  .hold .verdict { color: var(--replay); }
  .mini { font-size: 10.5px; padding: 2px 8px; margin: 2px 2px 0 0; border-radius: 4px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; font-weight: 600; }
  .mini.ok { color: var(--allow); } .mini.no { color: var(--deny); }
</style>
</head>
<body>
<header>
  <h1>bounds · control room</h1>
  <span class="tag">Automate freely. Act within bounds.</span>
  <span class="tag" id="status" style="margin-left:auto"></span>
</header>
<main>
  <section id="boundaries-pane">
    <h2>Boundaries — what is granted</h2>
    <div id="boundaries"></div>
  </section>

  <section>
    <h2>Propose — what is being asked</h2>
    <form id="prompt-form">
      <b style="font-size:13px">Natural language → model → gate</b>
      <div class="row2">
        <div><label>agent</label><select id="p-agent"></select></div>
        <div><label>requested by</label><input id="p-by" value="operator"></div>
      </div>
      <label>prompt</label>
      <textarea id="p-text" rows="3">Invoice INV-042 is overdue. Send a polite payment reminder to alice@example.com and bob@example.com.</textarea>
      <button>Run through interpret()</button>
    </form>

    <form id="direct-form">
      <b style="font-size:13px">Direct proposal → gate</b>
      <div class="row2">
        <div><label>agent</label><select id="d-agent"></select></div>
        <div><label>requested by</label><input id="d-by" value="operator"></div>
      </div>
      <div class="row2">
        <div><label>action</label><select id="d-action"></select></div>
        <div><label>&nbsp;</label><button style="margin-top:0;width:100%">Propose</button></div>
      </div>
      <label>params (json)</label>
      <textarea id="d-params" rows="3">{"to": ["a@example.com", "b@example.com"], "subject": "overdue invoice"}</textarea>
    </form>

    <h2>Verdicts</h2>
    <div id="results"></div>
  </section>

  <section>
    <h2>Action log — what was decided</h2>
    <table>
      <thead><tr><th>id</th><th>decision</th><th>action</th><th>agent · source</th><th>detail</th></tr></thead>
      <tbody id="log"></tbody>
    </table>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, body };
}

// --- boundaries pane -----------------------------------------------------
let boundaries = [];
async function loadBoundaries() {
  const { body } = await api("/api/boundaries");
  boundaries = body;
  $("boundaries").innerHTML = body.map(b => `
    <div class="card">
      <div class="b-head"><b>${esc(b.agent)}</b>
        <span class="muted">${esc(b.tenant)} · v${b.version}${b.active ? " · active" : " · inactive"}</span></div>
      <div>${b.actions_allowed.map(a => `<span class="chip">${esc(a)}</span>`).join("")}</div>
      <dl class="kv" style="margin-top:6px">
        <dt>limits</dt><dd>${esc(JSON.stringify(b.limits))}</dd>
        <dt>data scope</dt><dd>${b.data_scope.map(esc).join(", ") || "—"}</dd>
        <dt>model tier</dt><dd>${esc(b.model_tier)}</dd>
        <dt>credential</dt><dd>${esc(b.credential_ref)} ${b.credential_scope ? "· scope " + b.credential_scope.map(esc).join(",") : ""}</dd>
        <dt>pointer</dt><dd>${esc(b.secret_uri || "—")}</dd>
        <dt>authored by</dt><dd>${esc(b.created_by)}</dd>
      </dl>
      <div class="muted" style="margin-top:6px">read-only — boundaries change in psql, deliberately</div>
    </div>`).join("") || `<div class="muted">no boundaries — nothing is granted</div>`;

  const agents = [...new Set(body.filter(b => b.active).map(b => b.agent))];
  for (const sel of ["p-agent", "d-agent"])
    $(sel).innerHTML = agents.map(a => `<option>${esc(a)}</option>`).join("");
  syncActions();
}
function syncActions() {
  const b = boundaries.find(x => x.agent === $("d-agent").value && x.active);
  $("d-action").innerHTML = (b ? b.actions_allowed : []).map(a => `<option>${esc(a)}</option>`).join("");
}
$("d-agent").addEventListener("change", syncActions);

// --- verdict cards -------------------------------------------------------
function verdictCard(out) {
  if (out.replayed) return { cls: "replay", v: "REPLAY", detail: `original log #${out.id} returned — nothing re-sent`, body: out };
  if (out.held) return { cls: "hold", v: "HELD", detail: `${out.reason} — waiting on a human verdict`, body: out };
  if (out.allowed === false) return { cls: "deny", v: "DENY", detail: out.reason, body: out };
  if (out.allowed) return { cls: "allow", v: "ALLOW", detail: `outcome: ${out.outcome}${out.approved_by ? " · approved by " + out.approved_by : ""}`, body: out.result };
  return { cls: "", v: "?", detail: "", body: out };
}
function pushResult(html) { $("results").insertAdjacentHTML("afterbegin", html); refreshLog(); }

function renderDispatch(out) {
  const c = verdictCard(out);
  pushResult(`<div class="card result ${c.cls}">
    <span class="verdict">${c.v}</span> <span class="muted">log #${out.log_id ?? out.id ?? "—"}</span>
    <div class="reason">${esc(c.detail ?? "")}</div>
    <pre>${esc(JSON.stringify(c.body, null, 1))}</pre></div>`);
}

// --- forms ---------------------------------------------------------------
$("direct-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  let params;
  try { params = JSON.parse($("d-params").value); }
  catch { return pushResult(`<div class="card result deny"><span class="verdict">BAD JSON</span><div class="reason">params must be valid JSON</div></div>`); }
  const { body } = await api("/api/dispatch", { method: "POST", headers: {"content-type": "application/json"},
    body: JSON.stringify({ agent: $("d-agent").value, requested_by: $("d-by").value, action: $("d-action").value, params }) });
  renderDispatch(body);
});

$("prompt-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button"); btn.disabled = true;
  try {
    const { ok, body } = await api("/api/prompt", { method: "POST", headers: {"content-type": "application/json"},
      body: JSON.stringify({ agent: $("p-agent").value, requested_by: $("p-by").value, prompt: $("p-text").value }) });
    if (!ok) return pushResult(`<div class="card result deny"><span class="verdict">UNAVAILABLE</span><div class="reason">${esc(body.error || "prompt failed")}</div></div>`);
    for (const a of (body.actions || [])) renderDispatch(a);
    pushResult(`<div class="card"><span class="verdict" style="color:var(--accent)">MODEL</span>
      <span class="muted">${esc(body.stopped)} · ${body.turns} turn(s) · ${(body.actions || []).length} proposal(s)</span>
      <div class="say">${esc(body.text || "(no closing text)")}</div></div>`);
  } finally { btn.disabled = false; }
});

// --- log pane ------------------------------------------------------------
async function refreshLog() {
  const { body } = await api("/api/log?limit=100");
  $("status").textContent = `${body.length} log rows · live`;
  $("log").innerHTML = body.map(r => `
    <tr>
      <td>${r.id}</td>
      <td><span class="badge ${r.decision}">${r.decision}</span></td>
      <td>${esc(r.action_requested)}<br><span class="muted">${esc(JSON.stringify(r.action_params))}</span></td>
      <td>${esc(r.agent)}<br><span class="muted">${esc(r.tenant)} · ${esc(r.trigger_source)}${r.correlation_id ? " · ⛓" + esc(r.correlation_id.slice(0, 8)) : ""}</span></td>
      <td class="${r.decision === "deny" ? "why" : "ok"}">${esc(r.deny_reason ?? r.outcome ?? "…")}${r.decision === "hold" ? `
        <br><button class="mini ok" onclick="decide(${r.id},'approved')">approve</button>
        <button class="mini no" onclick="decide(${r.id},'rejected')">reject</button>` : ""}
      </td>
    </tr>`).join("");
}

async function decide(logId, verdict) {
  const by = window.prompt(`${verdict} log #${logId} — your name (a human's, on the record):`);
  if (!by) return;
  const { body } = await api("/api/decide", { method: "POST", headers: {"content-type": "application/json"},
    body: JSON.stringify({ log_id: logId, verdict, by }) });
  renderDispatch(body);
}

loadBoundaries();
refreshLog();
setInterval(refreshLog, 2000);
</script>
</body>
</html>
