[project]
# Working name. Renaming means touching this file, src/bounds/, and imports.
name = "bounds"
version = "0.1.0"
description = "A deterministic control plane for agent actions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "howldr Services Group, LLC" }]
requires-python = ">=3.11"   # 3.11 for `X | None` and the walrus/match ergonomics used
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# interpret.py takes the client by injection and imports nothing from the
# SDK; this extra exists so `pip install bounds[interpret]` gets you one.
interpret = ["anthropic>=0.116"]
# secrets.py imports keyring lazily, only when a keyring:// uri is resolved.
secrets = ["keyring>=25"]
# the control room (gui.py) — a window onto the gate, not part of it.
gui = ["fastapi>=0.115", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling>=1.27"]   # SPDX `license` + `license-files`
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bounds"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# pinned to the pre-0.17 default so a ruff upgrade does not move the goalposts
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
